<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>منصة إدارة الجودة | التقارير الربعية</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/exceljs@4.3.0/dist/exceljs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
    <style>
        /* ستايل بسيط للكرت الجديد ليتناسب مع موقعك */
        .quarterly-card { background: #fff; border-radius: 15px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin: 20px 0; }
        .q-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-top: 15px; }
        .q-box { background: #f8f9fa; padding: 15px; border-radius: 10px; text-align: center; border: 1px solid #eee; }
        .q-title { font-weight: bold; color: #333; margin-bottom: 5px; }
        .q-val { font-size: 20px; color: #007B6E; font-weight: 900; }
        .export-btn { background: linear-gradient(135deg, #00C8B4, #007B6E); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 15px; width: 100%; }
    </style>
</head>
<body>

    <div class="quarterly-card">
        <h3>📊 تحليل التقارير الربعية الشامل (KPIs)</h3>
        <p style="font-size: 12px; color: #666;">يتم التحديث تلقائياً بناءً على بيانات الكروت الأخرى</p>
        
        <div class="q-grid">
            <div class="q-box">
                <div class="q-title">الربع الأول</div>
                <div id="val-Q1" class="q-val">0</div>
                <div style="font-size: 10px;">(يناير - مارس)</div>
            </div>
            <div class="q-box">
                <div class="q-title">الربع الثاني</div>
                <div id="val-Q2" class="q-val">0</div>
                <div style="font-size: 10px;">(أبريل - يونيو)</div>
            </div>
            <div class="q-box">
                <div class="q-title">الربع الثالث</div>
                <div id="val-Q3" class="q-val">0</div>
                <div style="font-size: 10px;">(يوليو - سبتمبر)</div>
            </div>
            <div class="q-box">
                <div class="q-title">الربع الرابع</div>
                <div id="val-Q4" class="q-val">0</div>
                <div style="font-size: 10px;">(أكتوبر - ديسمبر)</div>
            </div>
        </div>

        <button onclick="exportQuarterlyExcel()" class="export-btn">📥 تصدير تحليل KPIs شامل (إكسل)</button>
    </div>

    <script>
        // --- محرك الربط والتحليل الذكي ---

        // دالة لتحديد الربع
        function getQuarter(dateStr) {
            const d = new Date(dateStr);
            const m = d.getMonth() + 1;
            if (m <= 3) return 'Q1';
            if (m <= 6) return 'Q2';
            if (m <= 9) return 'Q3';
            return 'Q4';
        }

        // دالة جلب البيانات من كافة الكروت
        async function updateAllQuarterlyStats() {
            // أسماء الجداول المرتبطة بالكروت
            const tables = ['violations_male', 'violations_female', 'ops_efficiency', 'sales_report', 'customer_survey'];
            let stats = { Q1: 0, Q2: 0, Q3: 0, Q4: 0 };
            let detailedData = [];

            for (let table of tables) {
                const { data, error } = await supabase.from(table).select('*');
                if (!error && data) {
                    data.forEach(item => {
                        const q = getQuarter(item.created_at || new Date());
                        stats[q]++;
                        detailedData.push({ ...item, table_name: table, quarter: q });
                    });
                }
            }

            // تحديث الأرقام في الواجهة
            document.getElementById('val-Q1').innerText = stats.Q1;
            document.getElementById('val-Q2').innerText = stats.Q2;
            document.getElementById('val-Q3').innerText = stats.Q3;
            document.getElementById('val-Q4').innerText = stats.Q4;

            window.cachedQuarterlyData = detailedData; // حفظ البيانات للتصدير
        }

        // دالة تصدير الإكسل مع الفجوات والتوصيات
        async function exportQuarterlyExcel() {
            const data = window.cachedQuarterlyData;
            if (!data || data.length === 0) return alert("لا توجد بيانات حالياً");

            const workbook = new ExcelJS.Workbook();
            const sheet = workbook.addWorksheet('تحليل المؤشرات الربعية');

            sheet.columns = [
                { header: 'الربع', key: 'q', width: 10 },
                { header: 'الكرت/القسم', key: 'table', width: 20 },
                { header: 'الفجوة المرصودة', key: 'gap', width: 30 },
                { header: 'الأسباب', key: 'reason', width: 30 },
                { header: 'التوصيات', key: 'rec', width: 35 }
            ];

            data.forEach(item => {
                // منطق ذكي لاستخراج الفجوات (مثال)
                let gap = "أداء مستقر";
                let reason = "الالتزام بالمعايير";
                let rec = "الاستمرار على نفس النهج";

                if (item.table_name.includes('violations')) {
                    gap = "وجود مخالفات تشغيلية";
                    reason = "ضعف الرقابة الميدانية";
                    rec = "تكثيف التدريب وتفعيل لائحة الجزاءات";
                }

                sheet.addRow({
                    q: item.quarter,
                    table: item.table_name,
                    gap: gap,
                    reason: reason,
                    rec: rec
                });
            });

            const buffer = await workbook.xlsx.writeBuffer();
            saveAs(new Blob([buffer]), "تقرير_تحليل_الأرباع_KPIs.xlsx");
        }

        // تشغيل التحديث التلقائي عند فتح الصفحة
        setTimeout(updateAllQuarterlyStats, 2000);
    </script>
</body>
</html>
